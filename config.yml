      icon: "fa-solid fa-globe"
      text: "Sitio web oficial"
      url: "https://www.codesunlu.tech/"
      alt: "Sitio web oficial del CODES++"
      title: "Sitio web oficial del CODES++"
      target: "_blank"
  - link:
